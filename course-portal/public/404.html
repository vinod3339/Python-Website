<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>23CS301 — Problem Solving using Python</title>
    <script>
      // GitHub Pages 404 redirect for SPA
      // Encodes the path and redirects to index.html
      var pathSegmentsToKeep = 1; // 1 = keep the repo name segment (/Python-Website)
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
